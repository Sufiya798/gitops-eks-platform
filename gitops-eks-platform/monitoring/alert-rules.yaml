apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitops-eks-app-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: gitops-eks-app.rules
      rules:
        - alert: AppPodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="app"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "{{ $labels.pod }} in {{ $labels.namespace }} has restarted repeatedly in the last 15m."

        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{job="gitops-eks-app", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="gitops-eks-app"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High 5xx error rate on gitops-eks-app"
            description: "More than 5% of requests are failing over the last 5 minutes."

        - alert: DeploymentReplicasMismatch
          expr: kube_deployment_spec_replicas{namespace="app"} != kube_deployment_status_replicas_available{namespace="app"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} has mismatched replicas"
            description: "Desired and available replica counts have differed for 10+ minutes."
