name: Build, Test, Push

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

  permissions:
    contents: write

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/gitops-eks-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: app
        run: pytest -q || echo "no tests yet - add app/test_app.py"

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update image tag in k8s manifest
        run: |
          sed -i "s|image: .*gitops-eks-app.*|image: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}|" k8s/base/deployment.yaml

      - name: Commit updated manifest (GitOps trigger for ArgoCD)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/deployment.yaml
          git commit -m "ci: bump image to ${{ steps.vars.outputs.sha_short }}" || echo "no changes to commit"
          git push
